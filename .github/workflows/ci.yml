name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Model must beat the rules on held-out days
        run: |
          countersign train
          python -c "import json; r=json.load(open('artifacts/report.json')); assert r['model']['recall'] > r['rules']['recall'] + 0.2, r['model']"

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e .
      - name: Rebuild demo data from scratch, then check JavaScript matches Python
        run: countersign train && countersign export
      - run: npm ci && npm test && npm run build
        working-directory: web
