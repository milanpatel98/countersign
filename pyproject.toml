[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countersign"
version = "0.1.0"
description = "Real-time card fraud scoring with features that cannot drift between training and serving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milan Patel" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
countersign = "countersign.cli:main"

[tool.setuptools.packages.find]
include = ["countersign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
